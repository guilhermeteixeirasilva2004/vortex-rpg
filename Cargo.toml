[workspace]
resolver = "2"
members = ["crates/shared", "crates/client", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shared = { path = "crates/shared" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Cliente
# default-features desligado: sem áudio (alsa), gamepad (libudev), glTF, picking, etc.
# Menos coisa pra compilar e menos trabalho por frame em GPU integrada.
bevy = { version = "0.16", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "bevy_log",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "default_font",
    "tonemapping_luts",
    "x11",
] }
tokio-tungstenite = "0.26"
crossbeam-channel = "0.5"

# Servidor
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Bevy é lento em debug sem otimização; otimiza as dependências e deixa nosso código leve.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
